[package]
name = "the-collector"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.36", features = ["derive"] }
hyper = "1.6.0"
minio-rsc = "0.2.3"
regex = "1.11.1"
reqwest = "0.12.15"
tokio = { version = "1.44.2", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
strip = "debuginfo"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "link-arg=-lm"]
